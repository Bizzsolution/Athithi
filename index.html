// ── IMAGE COMPRESSION (canvas → JPEG, max 600px, 65% quality) ──
const compressImg=(dataUrl,maxW=600)=>new Promise((res,rej)=>{
  const img=new Image();
  img.onload=()=>{
    const sc=Math.min(1,maxW/Math.max(img.width,img.height,1));
    const c=document.createElement("canvas");
    c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    res(c.toDataURL("image/jpeg",0.65));
  };
  img.onerror=rej; img.src=dataUrl;
});

// ── DUAL STORAGE (window.storage primary + localStorage backup) ─
const WS={
  async get(k){try{const r=await window.storage.get(k);return r?JSON.parse(r.value):null;}catch{return null;}},
  async set(k,v){try{await window.storage.set(k,JSON.stringify(v));}catch{}},
  // Images: stored in both window.storage AND localStorage
  async getRawImg(k){
    // Try window.storage first
    try{const r=await window.storage.get(k);if(r?.value)return r.value;}catch{}
    // Fallback to localStorage
    try{const v=localStorage.getItem(`ab_${k}`);if(v)return v;}catch{}
    return null;
  },
  async setRawImg(k,v){
    // Write to both storages
    try{await window.storage.set(k,v);}catch(e){console.warn("WS img save:",e);}
    try{localStorage.setItem(`ab_${k}`,v);}catch(e){console.warn("LS img save:",e);}
  },
  async list(pfx){try{const r=await window.storage.list(pfx);return r?.keys||[];}catch{return [];}},
  async del(k){try{await window.storage.delete(k);}catch{}},
};

function SignaturePad({onSign}){
  const canvasRef=useRef();
  const drawing=useRef(false);
  const lastPos=useRef(null);
  const[signed,setSigned]=useState(false);
  const[saved,setSaved]=useState(false);

  const getPos=(e)=>{
    const c=canvasRef.current;const rect=c.getBoundingClientRect();
    const sx=c.width/rect.width,sy=c.height/rect.height;
    const src=e.touches?e.touches[0]:e;
    return{x:(src.clientX-rect.left)*sx,y:(src.clientY-rect.top)*sy};
  };
  const startDraw=(e)=>{e.preventDefault();drawing.current=true;lastPos.current=getPos(e);};
  const draw=(e)=>{
    e.preventDefault();if(!drawing.current)return;
    const c=canvasRef.current;const ctx=c.getContext("2d");
    const pos=getPos(e);
    ctx.beginPath();ctx.moveTo(lastPos.current.x,lastPos.current.y);
    ctx.lineTo(pos.x,pos.y);
    ctx.strokeStyle="#1e3a5f";ctx.lineWidth=2.5;ctx.lineCap="round";ctx.lineJoin="round";
    ctx.stroke();lastPos.current=pos;
    if(!signed)setSigned(true);if(saved){setSaved(false);onSign(null);}
  };
  const stopDraw=(e)=>{e.preventDefault();drawing.current=false;};
  const clearPad=()=>{
    const c=canvasRef.current;c.getContext("2d").clearRect(0,0,c.width,c.height);
    setSigned(false);setSaved(false);onSign(null);
  };
  const saveSig=()=>{
    if(!signed)return;
    const dataUrl=canvasRef.current.toDataURL("image/png");
    onSign(dataUrl);setSaved(true);
  };

  return(
    <div className="card" style={{padding:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <div>
          <div style={{fontWeight:700,fontSize:15,color:"var(--navy)"}}>✍️ Guest Signature</div>
          <div style={{fontSize:11,color:"var(--muted)"}}>Sign with finger · Used on invoice & vault</div>
        </div>
        {saved&&<span className="badge bg">✓ Captured</span>}
      </div>
      <div style={{position:"relative",borderRadius:10,overflow:"hidden",border:`1.5px dashed ${signed?"var(--navy)":"var(--border)"}`,background:"#fff"}}>
        <canvas ref={canvasRef} width={360} height={140}
          style={{width:"100%",height:140,display:"block",touchAction:"none",cursor:"crosshair"}}
          onMouseDown={startDraw} onMouseMove={draw} onMouseUp={stopDraw} onMouseLeave={stopDraw}
          onTouchStart={startDraw} onTouchMove={draw} onTouchEnd={stopDraw}
        />
        {!signed&&(
          <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",pointerEvents:"none",gap:6}}>
            <span style={{fontSize:28,opacity:.25}}>✍️</span>
            <span style={{fontSize:12,color:"var(--muted)",opacity:.5}}>Draw signature here</span>
          </div>
        )}
      </div>
      <div style={{display:"flex",gap:8,marginTop:10}}>
        <button onClick={clearPad} className="btn-o" style={{flex:1,padding:"9px 0",fontSize:13}}>🗑️ Clear</button>
        <button onClick={saveSig} disabled={!signed} className={signed?"btn-n":"btn-o"}
          style={{flex:2,padding:"9px 0",fontSize:13,opacity:signed?1:.5}}>
          {saved?"✅ Signature Saved":"💾 Confirm Signature"}
        </button>
      </div>
    </div>
  );
}

/* ── CHECK-IN VIEW ────────────────────────────────────────────── */
function CheckInView({rooms,checkInRoom,onCheckIn,setView}){
  const empty=rooms.filter(r=>r.status==="empty");
  const tempId=useRef(uid()).current;
  const[form,setForm]=useState({roomId:checkInRoom?.id||empty[0]?.id||"",name:"",mobile:"",aadhaar:"",address:"",dob:"",gender:"",adults:"1",children:"0",checkIn:todayStr(),checkOut:tomorrowStr(),purpose:"Leisure"});
  const[done,setDone]=useState(false);
  const[signature,setSignature]=useState(null);
  const[photoF,setPhotoF]=useState(null);
  const[photoB,setPhotoB]=useState(null);
  const[scanning,setScanning]=useState(null); // "f" | "b" | null
  const[scanMsg,setScanMsg]=useState("");
  const fld=(k,v)=>setForm(p=>({...p,[k]:v}));
  const fldAadhaar=v=>{const digits=v.replace(/\D/g,"").slice(0,12);const f=digits.match(/.{1,4}/g)?.join(" ")||"";fld("aadhaar",f);};
  const onPhoto=(e,side)=>{
    const file=e.target.files&&e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=async ev=>{
      const du=ev.target.result;
      (side==="f"?setPhotoF:setPhotoB)(du);
      try{localStorage.setItem("ph_"+side+"_"+tempId,du);}catch(x){}
      // 🚀 Auto-trigger scan immediately after upload
      await scanAadhaar(side,du);
    };
    r.readAsDataURL(file);
    e.target.value="";
  };

  // ── BROWSER OCR — Tesseract.js (works offline, no API key needed) ──
  const scanAadhaar=async(side,dataUrlArg)=>{
    const photo=dataUrlArg||(side==="f"?photoF:photoB);
    if(!photo){alert("Upload photo first");return;}
    setScanning(side);setScanMsg("⏳ Loading OCR engine (first time only, ~10s)...");
    try{
      const worker=await createWorker("eng",1,{
        logger:m=>{if(m.status==="recognizing text")setScanMsg(`⏳ Reading Aadhaar... ${Math.round((m.progress||0)*100)}%`);}
      });
      setScanMsg("⏳ Reading Aadhaar text...");
      const {data:{text}}=await worker.recognize(photo);
      await worker.terminate();
      if(!text||!text.trim())throw new Error("No text detected. Use clearer, well-lit photo.");
      let count=0;
      // Aadhaar number (12 digits)
      const aM=text.match(/\b\d{4}\s?\d{4}\s?\d{4}\b/);
      if(aM){fld("aadhaar",aM[0].replace(/(\d{4})\s?(\d{4})\s?(\d{4})/,"$1 $2 $3"));count++;}
      // DOB
      const dM=text.match(/\b(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4})\b/);
      if(dM){fld("dob",dM[1].replace(/-/g,"/"));count++;}
      // Gender
      if(/\bFemale\b/i.test(text)){fld("gender","Female");count++;}
      else if(/\bMale\b/i.test(text)){fld("gender","Male");count++;}
      else if(/महिला/.test(text)){fld("gender","Female");count++;}
      else if(/पुरुष/.test(text)){fld("gender","Male");count++;}
      // Name (look for "Name:" label or all-caps line)
      const nLabel=text.match(/(?:Name|नाम)\s*[:|]?\s*([A-Z][A-Za-z\s\.]{3,40})/i);
      if(nLabel){fld("name",nLabel[1].trim());count++;}
      else{
        const capLine=text.split("\n").map(l=>l.trim()).find(l=>/^[A-Z][A-Z\s]{4,30}$/.test(l));
        if(capLine){fld("name",capLine);count++;}
      }
      // Address (back side — concatenate first few useful lines)
      if(side==="b"){
        const addrLines=text.split("\n").map(l=>l.trim()).filter(l=>l.length>5&&!/^\d{4}\s\d{4}/.test(l));
        if(addrLines.length>0){fld("address",addrLines.slice(0,4).join(", "));count++;}
      }
      if(count>0)setScanMsg(`✅ Auto-filled ${count} field${count>1?"s":""}! Verify & correct below.`);
      else setScanMsg("⚠️ OCR ran but no fields extracted. Try clearer photo or fill manually.");
    }catch(e){
      setScanMsg(`❌ ${e.message.slice(0,120)}. Fill manually below.`);
    }finally{setScanning(null);}
  };
  const sel=rooms.find(r=>r.id===form.roomId);
  const n=nts(form.checkIn,form.checkOut);
  const rt=sel?sel.rate*n:0;

  const submit=()=>{

/* ── PROFILE EDIT MODAL (Owner name + Hotel logo/banner) ──────── */
function ProfileEditModal({profile,onSave,onClose}){
  const[name,setName]=useState(profile.ownerName||"");
  const[tagline,setTagline]=useState(profile.hotelTagline||"");
  const[logo,setLogo]=useState(profile.hotelLogo||null);
  const[banner,setBanner]=useState(profile.hotelBanner||null);

  const onImg=(e,kind)=>{
    const file=e.target.files&&e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const cv=document.createElement("canvas");
        const maxW=kind==="logo"?400:1200;
        const sc=Math.min(1,maxW/Math.max(img.width,img.height,1));
        cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        const compressed=cv.toDataURL("image/jpeg",0.75);
        (kind==="logo"?setLogo:setBanner)(compressed);
      };
      img.src=ev.target.result;
    };
    r.readAsDataURL(file);
    e.target.value="";
  };

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:100,display:"flex",alignItems:"flex-end"}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{width:"100%",maxHeight:"90vh",overflowY:"auto",background:"#fff",borderTopLeftRadius:24,borderTopRightRadius:24}}>
        <div style={{padding:"16px 16px 12px",borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,background:"#fff",zIndex:1}}>
          <h3 style={{margin:0,fontFamily:"'Josefin Sans',sans-serif"}}>👤 Edit Owner Profile</h3>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:24,cursor:"pointer",color:"var(--muted)",lineHeight:1}}>×</button>
        </div>

        <div style={{padding:16,display:"flex",flexDirection:"column",gap:14}}>

          {/* Owner Name */}
          <div>
            <label style={{fontSize:12,fontWeight:600,color:"var(--muted)",display:"block",marginBottom:5}}>👤 OWNER / MANAGER NAME</label>
            <input value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Rajesh Kumar"/>
          </div>

          {/* Hotel Tagline */}
          <div>
            <label style={{fontSize:12,fontWeight:600,color:"var(--muted)",display:"block",marginBottom:5}}>🏨 HOTEL TAGLINE</label>
            <input value={tagline} onChange={e=>setTagline(e.target.value)} placeholder="e.g. Your home away from home"/>
          </div>

          {/* Hotel Logo */}
          <div>
            <label style={{fontSize:12,fontWeight:600,color:"var(--muted)",display:"block",marginBottom:5}}>🖼️ HOTEL LOGO (Square)</label>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              {logo?(
                <div style={{position:"relative"}}>
                  <img src={logo} style={{width:70,height:70,objectFit:"cover",borderRadius:12,border:"2px solid var(--gold)"}}/>
                  <button onClick={()=>setLogo(null)} style={{position:"absolute",top:-6,right:-6,width:22,height:22,borderRadius:11,border:"none",background:"#dc2626",color:"#fff",fontSize:11,cursor:"pointer",lineHeight:1}}>×</button>
                </div>
              ):(
                <div style={{width:70,height:70,borderRadius:12,border:"2px dashed var(--border)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,color:"var(--muted)"}}>🏨</div>
              )}
              <div style={{flex:1}}>
                <input type="file" accept="image/*" onChange={e=>onImg(e,"logo")}
                  style={{width:"100%",boxSizing:"border-box",padding:"10px",border:"2px dashed var(--gold)",borderRadius:8,background:"#fffbeb",fontSize:11,color:"var(--gold2)",cursor:"pointer"}}/>
                <div style={{fontSize:10,color:"var(--muted)",marginTop:3}}>Shows in header · 400px max</div>
              </div>
            </div>
          </div>

          {/* Dashboard Banner */}
          <div>
            <label style={{fontSize:12,fontWeight:600,color:"var(--muted)",display:"block",marginBottom:5}}>🌅 DASHBOARD BANNER</label>
            {banner?(
              <div style={{position:"relative",marginBottom:6}}>
                <img src={banner} style={{width:"100%",height:120,objectFit:"cover",borderRadius:12,border:"1.5px solid var(--border)",display:"block"}}/>
                <button onClick={()=>setBanner(null)} style={{position:"absolute",top:6,right:6,width:26,height:26,borderRadius:13,border:"none",background:"rgba(220,38,38,.95)",color:"#fff",fontSize:13,cursor:"pointer",lineHeight:1}}>×</button>
              </div>
            ):null}
            <input type="file" accept="image/*" onChange={e=>onImg(e,"banner")}
              style={{width:"100%",boxSizing:"border-box",padding:"16px 8px",border:"2px dashed var(--navy)",borderRadius:10,background:"#eff6ff",fontSize:12,color:"var(--navy)",cursor:"pointer",display:"block"}}/>
            <div style={{fontSize:10,color:"var(--muted)",marginTop:4}}>Shown at top of Dashboard · 1200px max · landscape preferred</div>
          </div>

          <div style={{display:"flex",gap:8,marginTop:6}}>
            <button onClick={onClose} className="btn-o" style={{flex:1}}>Cancel</button>
            <button onClick={()=>onSave({ownerName:name.trim(),hotelTagline:tagline.trim(),hotelLogo:logo,hotelBanner:banner})} className="btn-p" style={{flex:2}}>✅ Save Profile</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── ROOM EDIT MODAL ──────────────────────────────────────────── */
function RoomEditModal({room,onSave,onClose}){
  const[name,setName]=useState(room.name||"");
  const[type,setType]=useState(room.type);
  const[rate,setRate]=useState(room.rate);
  const[photos,setPhotos]=useState(room.photos||[]);
  const types=Object.keys(TYPE_META);

  const addPhoto=(e)=>{
    const file=e.target.files&&e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=ev=>{
      // Compress before storing
      const img=new Image();
      img.onload=()=>{
        const cv=document.createElement("canvas");
        const sc=Math.min(1,800/Math.max(img.width,img.height,1));
        cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        const compressed=cv.toDataURL("image/jpeg",0.7);
        setPhotos(p=>[...p,compressed]);
      };
      img.src=ev.target.result;
    };
    r.readAsDataURL(file);
    e.target.value="";
  };
  const removePhoto=i=>setPhotos(p=>p.filter((_,idx)=>idx!==i));

  const save=()=>{
    if(!type)return alert("Select room category");
    const r=parseInt(rate)||0;
    if(r<=0)return alert("Enter valid rate");
    onSave({...room,name:name.trim(),type,rate:r,photos});
  };

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:100,display:"flex",alignItems:"flex-end"}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{width:"100%",maxHeight:"90vh",overflowY:"auto",background:"#fff",borderTopLeftRadius:24,borderTopRightRadius:24}}>
        <div style={{padding:"16px 16px 12px",borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,background:"#fff",zIndex:1}}>
          <h3 style={{margin:0,fontFamily:"'Josefin Sans',sans-serif"}}>✏️ Edit Room {room.id}</h3>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:24,cursor:"pointer",color:"var(--muted)",lineHeight:1}}>×</button>
        </div>
        <div style={{padding:16,display:"flex",flexDirection:"column",gap:12}}>

          <div>
            <label style={{fontSize:12,fontWeight:600,color:"var(--muted)",display:"block",marginBottom:5}}>CUSTOM NAME (Optional)</label>
            <input value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Sea View, Garden Side"/>
          </div>

          <div>
            <label style={{fontSize:12,fontWeight:600,color:"var(--muted)",display:"block",marginBottom:5}}>CATEGORY *</label>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
              {types.map(t=>(
                <button key={t} onClick={()=>setType(t)}
                  style={{padding:"10px 8px",border:`1.5px solid ${type===t?"var(--navy)":"var(--border)"}`,borderRadius:8,
                    background:type===t?"var(--navy)":"#fff",color:type===t?"#fff":"var(--navy)",
                    fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"'Josefin Sans',sans-serif"}}>
                  {TYPE_META[t]?.emoji} {t}
                </button>
              ))}
            </div>
          </div>

          <div>
            <label style={{fontSize:12,fontWeight:600,color:"var(--muted)",display:"block",marginBottom:5}}>RATE PER NIGHT *</label>
            <input type="number" value={rate} onChange={e=>setRate(e.target.value)} placeholder="₹"/>
          </div>

          <div>
            <label style={{fontSize:12,fontWeight:600,color:"var(--muted)",display:"block",marginBottom:5}}>ROOM PHOTOS</label>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:6}}>
              {photos.map((p,i)=>(
                <div key={i} style={{position:"relative"}}>
                  <img src={p} style={{width:"100%",height:70,objectFit:"cover",borderRadius:8,border:"1.5px solid var(--border)",display:"block"}}/>
                  <button onClick={()=>removePhoto(i)}
                    style={{position:"absolute",top:3,right:3,width:20,height:20,borderRadius:10,border:"none",background:"rgba(220,38,38,.9)",color:"#fff",fontSize:11,cursor:"pointer",lineHeight:1}}>×</button>
                </div>
              ))}
            </div>
            <input type="file" accept="image/*" capture="environment" onChange={addPhoto}
              style={{width:"100%",boxSizing:"border-box",padding:"14px 8px",border:"2px dashed var(--navy)",borderRadius:10,background:"var(--cream)",fontSize:12,color:"var(--navy)",cursor:"pointer",display:"block"}}/>
            <div style={{fontSize:10,color:"var(--muted)",marginTop:4}}>Add multiple photos · 800px max · 70% compressed</div>
          </div>

          <div style={{display:"flex",gap:8,marginTop:6}}>
            <button onClick={onClose} className="btn-o" style={{flex:1}}>Cancel</button>
            <button onClick={save} className="btn-p" style={{flex:2}}>✅ Save Changes</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
//  ROOT APP — ASYNC STORAGE BOOTSTRAP
// ═══════════════════════════════════════════════════════════════
function App(){
  const[ready,setReady]=useState(false);
  const[user,setUser]=useState(null);
  const[view,setView]=useState("dash");
  const[rooms,setRooms]=useState([]);
  const[bookings,setBookings]=useState([]);
  const[modal,setModal]=useState(null);
  const[checkInRoom,setCIR]=useState(null);
  const[profile,setProfile]=useState(()=>{
    try{return{ownerName:localStorage.getItem("ownerName")||"",hotelTagline:localStorage.getItem("hotelTagline")||"",hotelLogo:localStorage.getItem("hotelLogo")||null,hotelBanner:localStorage.getItem("hotelBanner")||null};}
    catch{return{ownerName:"",hotelTagline:"",hotelLogo:null,hotelBanner:null};}
  });
  const saveProfile=(p)=>{
    setProfile(p);
    try{
      localStorage.setItem("ownerName",p.ownerName||"");
      localStorage.setItem("hotelTagline",p.hotelTagline||"");
      if(p.hotelLogo)localStorage.setItem("hotelLogo",p.hotelLogo);else localStorage.removeItem("hotelLogo");
      if(p.hotelBanner)localStorage.setItem("hotelBanner",p.hotelBanner);else localStorage.removeItem("hotelBanner");
    }catch{}
  };

  // Inject CSS
  useEffect(()=>{
    const s=document.createElement("style");s.textContent=CSS;document.head.appendChild(s);
    return()=>document.head.removeChild(s);
  },[]);

  // Load from persistent storage on boot
  useEffect(()=>{
    (async()=>{
      try{
        const[r,b,u]=await Promise.all([WS.get("rooms"),WS.get("bookings"),WS.get("cu")]);
        setRooms(r||initRooms());setBookings(b||[]);if(u)setUser(u);
      }catch{
        setRooms(LS.get("rooms",initRooms()));setBookings(LS.get("bookings",[]));
        const u=LS.get("user",null);if(u)setUser(u);
      }finally{setReady(true);}
    })();
  },[]);

  // Save helpers (dual write)
  const saveRooms=async r=>{setRooms(r);LS.set("rooms",r);await WS.set("rooms",r);};
  const saveBk=async b=>{setBookings(b);LS.set("bookings",b);await WS.set("bookings",b);};

  // Actions
  const handleCheckIn=async form=>{
    const id=form._tempId||uid();
    const{_tempId,_signature,_photoF,_photoB,...clean}=form;
    const nb={...clean,id,status:"active",charges:[],createdAt:new Date().toISOString()};
    if(_signature){
      nb.signature=_signature;
      try{await WS.setRawImg(`sig_${id}`,_signature);}catch{}
    }
    if(_photoF){try{await WS.setRawImg(`img_front_${id}`,_photoF);}catch{}try{localStorage.setItem(`ab_img_front_${id}`,_photoF);}catch{}}
    if(_photoB){try{await WS.setRawImg(`img_back_${id}`,_photoB);}catch{}try{localStorage.setItem(`ab_img_back_${id}`,_photoB);}catch{}}
    await saveRooms(rooms.map(r=>r.id===form.roomId?{...r,status:"occupied",bookingId:id}:r));
    await saveBk([...bookings,nb]);setCIR(null);
  };
  const handleAddCharge=async(bid,items)=>{
    const nb=bookings.map(b=>b.id===bid?{...b,charges:[...(b.charges||[]),...items]}:b);
    await saveBk(nb);
    if(modal?.b?.id===bid)setModal(p=>({...p,b:{...p.b,charges:[...(p.b.charges||[]),...items]}}));
  };
  const handleCheckOut=async bid=>{
    const b=bookings.find(x=>x.id===bid);const room=rooms.find(r=>r.id===b.roomId);
    const cSum=(b.charges||[]).reduce((s,c)=>s+c.price*c.qty,0);
    const sub=b.roomTotal+cSum;const gst=Math.round(sub*0.12);const grand=sub+gst;
    const ub={...b,status:"checkedout",checkOutActual:todayStr(),grandTotal:grand,subTotal:sub,gstAmt:gst};
    await saveRooms(rooms.map(r=>r.id===b.roomId?{...r,status:"empty",bookingId:null}:r));
    await saveBk(bookings.map(x=>x.id===bid?ub:x));
    openInvoice(ub,room);setModal(null);
  };
  const handleLogin=async s=>{setUser(s);LS.set("user",s);await WS.set("cu",s);};
  const handleLogout=async()=>{setUser(null);LS.set("user",null);await WS.del("cu");setView("dash");};

  // Loading
  if(!ready)return(
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"var(--navy)",gap:16}}>
      <div style={{fontSize:54}}>🏨</div>
      <div style={{fontFamily:"'Josefin Sans',sans-serif",fontSize:24,color:"#fff",letterSpacing:2}}>ATITHIBOOK</div>
      <div className="spin" style={{display:"inline-block",fontSize:28,marginTop:8}}>⚙️</div>
      <div style={{color:"rgba(255,255,255,.5)",fontSize:13}}>Loading secure vault...</div>
    </div>
  );
  if(!user)return <LoginScreen onLogin={handleLogin}/>;

  const liveB=bookings.find(b=>b.id===modal?.b?.id)||modal?.b;

  return(
    <div style={{maxWidth:430,margin:"0 auto",height:"100svh",display:"flex",flexDirection:"column",background:"var(--cream)",overflow:"hidden"}}>
      {/* Header */}
      <div style={{background:"var(--navy)",padding:"12px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0,boxShadow:"0 2px 10px rgba(0,0,0,.2)"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          {profile.hotelLogo
            ?<img src={profile.hotelLogo} style={{width:36,height:36,borderRadius:9,objectFit:"cover",border:"1.5px solid var(--gold)"}}/>
            :<span style={{fontSize:22}}>🏨</span>
          }
          <div>
            <div style={{fontFamily:"'Josefin Sans',sans-serif",fontWeight:700,fontSize:17,color:"#fff",letterSpacing:1}}>ATITHIBOOK</div>
            <div style={{fontSize:10,color:"rgba(255,255,255,.5)",letterSpacing:.5}}>{HOTEL.name}</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div onClick={()=>setModal({type:"editProfile"})} style={{textAlign:"right",cursor:"pointer"}}>
            <div style={{fontSize:12,color:"#fff",fontWeight:600}}>{profile.ownerName||user.name} ✏️</div>
            <div style={{fontSize:10,color:"var(--gold)"}}>{user.role}</div>
          </div>
          <button onClick={handleLogout} style={{background:"rgba(255,255,255,.12)",border:"none",borderRadius:8,padding:"6px 10px",color:"rgba(255,255,255,.7)",cursor:"pointer",fontSize:12,fontFamily:"'Josefin Sans',sans-serif"}}>Exit</button>
        </div>
      </div>

      {/* Content */}
      <div style={{flex:1,overflow:"hidden"}}>
        {view==="dash"&&<DashboardView rooms={rooms} bookings={bookings} user={user} setView={setView} setModal={setModal} profile={profile}/>}
        {view==="rooms"&&<RoomsView rooms={rooms} bookings={bookings} setModal={setModal} setView={setView} setCheckInRoom={setCIR}/>}
        {view==="checkin"&&<CheckInView rooms={rooms} checkInRoom={checkInRoom} onCheckIn={handleCheckIn} setView={setView}/>}
        {view==="billing"&&<BillingView rooms={rooms} bookings={bookings} setModal={setModal}/>}
        {view==="docs"&&<DocumentsView bookings={bookings} rooms={rooms}/>}
      </div>

      {/* Nav */}
      <div style={{flexShrink:0}}><BottomNav view={view} setView={setView}/></div>

      {/* Booking modal */}
      {modal?.type==="booking"&&liveB&&(
        <BookingModal b={liveB} room={modal.room} onAddCharge={handleAddCharge} onCheckOut={handleCheckOut} onClose={()=>setModal(null)}/>
      )}
      {/* Room edit modal */}
      {modal?.type==="editRoom"&&(
        <RoomEditModal room={modal.room}
          onSave={async(updated)=>{await saveRooms(rooms.map(r=>r.id===updated.id?updated:r));setModal(null);}}
          onClose={()=>setModal(null)}/>
      )}
      {/* Profile edit modal */}
      {modal?.type==="editProfile"&&(
        <ProfileEditModal profile={profile}
          onSave={(p)=>{saveProfile(p);setModal(null);}}
          onClose={()=>setModal(null)}/>
      )}
    </div>
  );
}

    // Mount React app and hide loader
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    setTimeout(() => { const l = document.getElementById('loader'); if (l) l.style.display = 'none'; }, 300);
  </script>
</body>
</html>
